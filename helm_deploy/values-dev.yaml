---
# Per environment values which override defaults in hmpps-people-on-probation-ui/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: probation-account-dev.hmpps.service.justice.gov.uk
    className: modsec-non-prod

  env:
    INGRESS_URL: "https://probation-account-dev.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
    ONE_LOGIN_ISSUER_URL: "https://oidc.integration.account.gov.uk"
    PEOPLE_ON_PROBATION_API_URL: "https://people-on-probation-api-dev.hmpps.service.justice.gov.uk"
    ONE_LOGIN_REDIRECT_URI: "https://probation-account-dev.hmpps.service.justice.gov.uk/sign-in/callback"
    ONE_LOGIN_POST_LOGOUT_REDIRECT_URI: "https://probation-account-dev.hmpps.service.justice.gov.uk"
    ENVIRONMENT_NAME: DEV
    AUDIT_ENABLED: "true"
    FEEDBACK_BANNER_ENABLED: "true"
    # Points at the streaming endpoint on the MoJ Cloud Platform chatbot
    # (via its Next.js proxy which forwards SSE frames through unchanged).
    # The old Railway URL was retired 2026-07.
    POP_CHATBOT_API_URL: "https://probationchatbot-dev.apps.live.cloud-platform.service.justice.gov.uk/api/proxy/chatbot/chat-embed-stream"

generic-prometheus-alerts:
  alertSeverity: hmpps-people-on-probation-nonprod
