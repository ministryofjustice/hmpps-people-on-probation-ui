---
# Per environment values which override defaults in hmpps-people-on-probation-ui/values.yaml

generic-service:
  ingress:
    host: probation-account.hmpps.service.justice.gov.uk
    className: modsec

  env:
    INGRESS_URL: "https://probation-account.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"
    ONE_LOGIN_ISSUER_URL: "https://oidc.account.gov.uk"
    PEOPLE_ON_PROBATION_API_URL: "https://people-on-probation-api.hmpps.service.justice.gov.uk"
    ONE_LOGIN_REDIRECT_URI: "https://probation-account.hmpps.service.justice.gov.uk/sign-in/callback"
    ONE_LOGIN_POST_LOGOUT_REDIRECT_URI: "https://probation-account.hmpps.service.justice.gov.uk"
    AUDIT_ENABLED: "true"
    FEEDBACK_BANNER_ENABLED: "true"
    # Points at the streaming endpoint on the MoJ Cloud Platform chatbot
    # prod namespace (via its Next.js proxy which forwards SSE frames
    # through unchanged).
    #
    # POP_CHATBOT_FEEDBACK_URL is set explicitly (rather than derived from
    # the chat URL by regex-swap) so that if the two ever diverge in path
    # structure, feedback can't silently 503 while chat keeps working.
    POP_CHATBOT_API_URL: "https://probationchatbot-prod.apps.live.cloud-platform.service.justice.gov.uk/api/proxy/chatbot/chat-embed-stream"
    POP_CHATBOT_FEEDBACK_URL: "https://probationchatbot-prod.apps.live.cloud-platform.service.justice.gov.uk/api/proxy/chatbot/feedback-embed"

generic-prometheus-alerts:
  alertSeverity: hmpps-people-on-probation
