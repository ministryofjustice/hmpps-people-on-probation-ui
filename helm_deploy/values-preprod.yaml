---
# Per environment values which override defaults in hmpps-people-on-probation-ui/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: probation-account-preprod.hmpps.service.justice.gov.uk
    className: modsec-non-prod

  env:
    INGRESS_URL: "https://probation-account-preprod.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in-preprod.hmpps.service.justice.gov.uk/auth"
    ONE_LOGIN_ISSUER_URL: "https://oidc.integration.account.gov.uk"
    PEOPLE_ON_PROBATION_API_URL: "https://people-on-probation-api-preprod.hmpps.service.justice.gov.uk"
    ONE_LOGIN_REDIRECT_URI: "https://probation-account-preprod.hmpps.service.justice.gov.uk/sign-in/callback"
    ONE_LOGIN_POST_LOGOUT_REDIRECT_URI: "https://probation-account-preprod.hmpps.service.justice.gov.uk"
    ENVIRONMENT_NAME: PRE-PRODUCTION
    AUDIT_ENABLED: "true"
    FEATURE_ADMIN_PREVIEW: "true"
    FEATURE_MISSED_APPOINTMENT_ALERT: "false"
    FEATURE_CHATBOT: "true"
    FEATURE_ANALYTICS: "true"
    FEEDBACK_BANNER_ENABLED: "true"
    ADMIN_RESTRICT_BY_USERNAME: "true"
    # The old Railway URL was retired 2026-07. The chatbot backend is
    # currently only deployed to `probationchatbot-dev` on MoJ Cloud
    # Platform — there's no preprod-specific chatbot namespace yet. Left
    # empty so the chatbot is cleanly disabled in preprod (route returns
    # a well-formed "not configured" error frame) until a proper preprod
    # chatbot instance exists.
    POP_CHATBOT_API_URL: ""

generic-prometheus-alerts:
  alertSeverity: hmpps-people-on-probation-nonprod
